# 내 재무·청약 정보
# 이 파일을 profile.toml로 복사해서 값을 채우세요.
#   cp profile.example.toml profile.toml
# profile.toml은 .gitignore에 들어 있어 GitHub에 올라가지 않습니다 (저장소가 공개라서 중요).
# 금액 단위: 만원

[assets]
cash = 30000                  # 바로 쓸 수 있는 현금·예금·주식 등 (3억)
deposit_to_return = 0         # 돌려받을 전세보증금 등
other_debt_annual_payment = 0 # 기존 대출(신용·자동차 등)의 연간 원리금 상환액

[income]
annual = 7000                 # 연소득 (세전, 부부 합산 가능)

[household]
age = 35                      # 세대주 만 나이
married = true
marriage_date = "2022-05-01"  # 혼인신고일 (미혼이면 빈 문자열)
dependents = 1                # 부양가족 수 (본인 제외: 배우자, 자녀, 부모 등)
homeless_since = ""           # 무주택 시작일. 비우면 만 30세 또는 혼인신고일 중 빠른 날로 계산
owns_home = false             # 현재 주택 소유 여부
first_time_buyer = true       # 생애최초 주택구입 여부 (세대원 전원 주택 소유 이력 없음)

[subscription]                # 청약통장
opened = "2015-03-01"         # 가입일
total_paid = 1500             # 납입 총액 (만원)
monthly_recognized_count = 100 # 인정 납입 회차

[loan]                        # 대출 가정 — 정책이 자주 바뀌니 실제 은행·정부 발표로 꼭 확인하세요
rate = 4.0                    # 대출 금리 (%)
stress_rate_add = 1.5         # 스트레스 DSR 가산 금리 (%p)
years = 40                    # 만기 (년)
dsr_limit = 40                # DSR 한도 (%)
ltv = 70                      # 담보인정비율 (%)
max_loan = 60000              # 대출 한도 상한 (만원). 수도권 주담대 6억 상한 등 정책 상한

[costs]
brokerage_rate = 0.5          # 중개수수료 (%)
misc = 300                    # 법무사·이사·인테리어 등 기타 비용 (만원)
